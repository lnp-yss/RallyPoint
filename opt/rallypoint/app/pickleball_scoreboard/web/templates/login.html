<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rally Point · Staff login</title><link rel="stylesheet" href="{{ url_for('static',filename='club.css') }}"><script src="{{ url_for('static',filename='login.js') }}?v=20261006-club-login" defer></script></head><body><main class="login"><p class="eyebrow">{{ "HOST ADMINISTRATION" if host_login else club_name }}</p><h1>Welcome to your court.</h1><p class="muted">Sign in to organize players and manage matches.</p>{% if login_clubs %}<div class="card"><label for="login-club">Club<select id="login-club">{% for choice in login_clubs %}<option value="{{ choice.url }}"{% if choice.url == selected_login %} selected{% endif %}>{{ choice.name }}</option>{% endfor %}</select></label><small>Choose your club first, then use that club’s staff account.</small><noscript>{% for choice in login_clubs %}<p><a href="{{ choice.url }}">{{ choice.name }}</a></p>{% endfor %}</noscript></div>{% endif %}<form action="{{ request.script_root }}/login" method="post" class="card"><input type="hidden" name="csrf" value="{{ csrf }}">{% if host_login %}<input type="hidden" name="host_admin" value="1">{% endif %}<label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="primary">SIGN IN</button><a href="{{ request.script_root }}/preview">View live scoreboard</a></form></main></body></html>
